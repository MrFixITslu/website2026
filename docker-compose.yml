version: "3.8"

services:
  saas-marketplace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-marketplace-app
    restart: always
    environment:
      - NODE_ENV=production
      # Let the internal container port match the external host port to avoid any proxy/port mismatches
      - PORT=3000
      # OPTIONAL. The admin password is now stored as a salted hash in
      # ./data/.admin_auth.json (created automatically on first boot), not
      # read from this env var on every login. ADMIN_PASSWORD is only used
      # as the *initial* one-time password the very first time the app runs
      # with no existing ./data/.admin_auth.json - after that, changing this
      # value has no effect. If left unset, a random one-time password is
      # generated instead and printed once to `docker logs saas-marketplace-app`.
      # Either way, the first successful login will force you to set a
      # permanent password before anything else in /admin is usable.
      # If you set this, escape any literal "$" in your .env file as "$$",
      # or Docker Compose will silently mangle the value (e.g. "P@ss$h3rWord"
      # must be written "P@ss$$h3rWord").
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      # PORT MAPPING: host_port:container_port
      # Adjust both sides if you want to use a different port, e.g., "80:80"
      - "3000:3000"
    volumes:
      # Mount the data directory rather than individual files to prevent Docker from creating dummy directories on the host
      - ./data:/app/data
      # Persist uploaded course media (audio/video/images/pdf) across restarts and rebuilds
      - ./uploads:/app/uploads
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
