services:
  V79website:
    build: .
    image: v79website:latest
    container_name: V79website
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CANONICAL_DOMAIN: ${CANONICAL_DOMAIN:-https://v79sl.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-vision79slu@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET_TOKEN: ${ADMIN_RESET_TOKEN:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-required}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      V79TIQUET_INTAKE_URL: ${V79TIQUET_INTAKE_URL:-http://v79-tiquet-manager:3050/api/public/intake}
      V79TIQUET_INTAKE_SECRET: ${V79TIQUET_INTAKE_SECRET:-}
      V79_HUB_EVENT_URL: ${V79_HUB_EVENT_URL:-http://v79-hub:3040/api/platform/events}
      V79_HUB_EVENT_SECRET: ${V79_HUB_EVENT_SECRET:-}
      V79_HUB_ORGANIZATION_REF: ${V79_HUB_ORGANIZATION_REF:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - proxy_network
networks:
  proxy_network:
    external: true
