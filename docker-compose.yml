version: "3.8"

services:
  saas-marketplace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-marketplace-app
    restart: always
    environment:
      - NODE_ENV=production
      # Let the internal container port match the external host port to avoid any proxy/port mismatches
      - PORT=3000
      # REQUIRED: set a strong admin password here (or in a .env file referenced
      # via env_file). If omitted, a random password is generated at startup
      # and printed once to `docker logs saas-marketplace-app` - it will change
      # every time the container restarts, so setting this explicitly is
      # strongly recommended for any persistent deployment.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your .env file or environment}
    ports:
      # PORT MAPPING: host_port:container_port
      # Adjust both sides if you want to use a different port, e.g., "80:80"
      - "3000:3000"
    volumes:
      # Mount the data directory rather than individual files to prevent Docker from creating dummy directories on the host
      - ./data:/app/data
      # Persist uploaded course media (audio/video/images/pdf) across restarts and rebuilds
      - ./uploads:/app/uploads
    networks:
      - proxy_network

networks:
  proxy_network:
    external: true
