<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Azure Gradient for outer V -->
    <linearGradient id="vOuterGrad" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#002b66" />
      <stop offset="35%" stop-color="#005bb5" />
      <stop offset="70%" stop-color="#00a8e8" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>

    <!-- Deep Shadow for inner fold of V -->
    <linearGradient id="vInnerShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001433" />
      <stop offset="50%" stop-color="#001e47" />
      <stop offset="100%" stop-color="#002b66" />
    </linearGradient>

    <!-- Top '7' Bar Gradient -->
    <linearGradient id="sevenTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="50%" stop-color="#008ae6" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- '7' Stem & Bevel Shadow -->
    <linearGradient id="sevenStemGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#004080" />
      <stop offset="60%" stop-color="#002b66" />
      <stop offset="100%" stop-color="#001a40" />
    </linearGradient>

    <!-- '9' Vibrant Ribbon Loop Gradient -->
    <linearGradient id="nineLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="30%" stop-color="#00c8d7" />
      <stop offset="65%" stop-color="#0077cc" />
      <stop offset="100%" stop-color="#003d80" />
    </linearGradient>

    <!-- '9' Tail Gradient -->
    <linearGradient id="nineTailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0055b3" />
      <stop offset="50%" stop-color="#0077e6" />
      <stop offset="100%" stop-color="#00d4d8" />
    </linearGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#001a40" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Main Symbol Group -->
  <g id="v79-mark" filter="url(#logoShadow)">
    <!-- ── 1. FLOATING DIGITAL PIXEL CUBES (Top-Left of V) ── -->
    <g id="pixel-cubes">
      <rect x="135" y="215" width="28" height="28" rx="4" fill="#00e5ff" opacity="0.95" />
      <rect x="175" y="195" width="22" height="22" rx="3" fill="#00a8e8" />
      <rect x="198" y="222" width="34" height="34" rx="5" fill="#005bb5" />
      <rect x="165" y="255" width="26" height="26" rx="4" fill="#00d4d8" />
      <rect x="195" y="265" width="22" height="22" rx="3" fill="#003d80" />
      <rect x="188" y="300" width="30" height="30" rx="4" fill="#00e5ff" />
      <rect x="224" y="308" width="36" height="36" rx="5" fill="#002b66" />
    </g>

    <!-- ── 2. THE 3D 'V' RIBBON ── -->
    <!-- Left outer arm of V (ascending with cyan-to-azure gradient) -->
    <path
      d="M 224 344 
         L 282 344 
         L 366 512 
         C 374 528 392 538 410 538 
         L 476 538 
         L 446 580 
         C 418 600 376 596 352 570 
         L 224 344 Z"
      fill="url(#vOuterGrad)"
    />

    <!-- Inner shadow face of the V arm fold -->
    <path
      d="M 352 570 
         L 418 522 
         L 366 512 
         Z"
      fill="url(#vInnerShadow)"
      opacity="0.9"
    />

    <!-- ── 3. THE '7' HORIZONTAL BAR & DIAGONAL STEM ── -->
    <!-- 7 Diagonal stem (descending downwards behind the ribbon fold) -->
    <path
      d="M 440 290 
         L 556 290 
         L 470 515 
         C 460 540 435 555 408 555 
         L 370 555 
         L 396 515 
         L 435 515 
         C 445 515 455 508 460 496 
         L 512 360 
         L 440 360 
         Z"
      fill="url(#sevenStemGrad)"
    />

    <!-- 7 Top horizontal ribbon facet -->
    <path
      d="M 390 290 
         L 556 290 
         C 568 290 576 298 572 310 
         L 552 360 
         L 390 360 
         C 400 340 420 290 390 290 Z"
      fill="url(#sevenTopGrad)"
    />

    <!-- ── 4. THE '9' RIBBON LOOP ── -->
    <!-- Outer looping ribbon for 9 -->
    <path
      d="M 556 290 
         C 615 290 660 335 660 395 
         C 660 445 630 488 585 504 
         L 522 610 
         C 512 628 488 634 470 624 
         C 452 614 446 590 458 572 
         L 518 472 
         C 512 458 508 440 508 422 
         C 508 368 538 332 556 290 Z"
      fill="url(#nineLoopGrad)"
    />

    <!-- 9 Inner Hole Cutout (giving the clean loop structure) -->
    <path
      d="M 580 370 
         C 600 370 615 385 615 405 
         C 615 425 600 440 580 440 
         C 560 440 545 425 545 405 
         C 545 385 560 370 580 370 Z"
      fill="#ffffff"
    />

    <!-- 9 Lower Tail Accentuation -->
    <path
      d="M 585 504 
         L 522 610 
         C 512 628 488 634 470 624 
         C 452 614 446 590 458 572 
         L 518 472 
         C 538 482 562 492 585 504 Z"
      fill="url(#nineTailGrad)"
    />
  </g>

  <!-- ── 5. OFFICIAL TYPOGRAPHY: V79 Digital ── -->
  <g id="typography-title" transform="translate(400, 680)" text-anchor="middle">
    <text
      font-family="'Montserrat', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="64"
      letter-spacing="-1.5"
      fill="#0B192C"
    >
      V79 <tspan font-weight="700" fill="#0B192C">Digital</tspan>
    </text>
  </g>

  <!-- ── 6. OFFICIAL TAGLINE: FROM IDEA TO ADVANTAGE ── -->
  <g id="typography-tagline" transform="translate(400, 725)" text-anchor="middle">
    <text
      font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif"
      font-weight="700"
      font-size="17"
      letter-spacing="9"
      fill="#0B192C"
    >
      FROM IDEA TO ADVANTAGE
    </text>
  </g>
</svg>
