<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="sevenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="nineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#00e5ff" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0b1f33" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Graphic Ribbon Symbol -->
  <g transform="translate(45, 40)" filter="url(#subtleShadow)">
    <!-- Pixel Particles on top-left of V -->
    <rect x="2" y="10" width="16" height="16" fill="#00e5ff" rx="2" />
    <rect x="22" y="2" width="16" height="16" fill="#0284c7" rx="2" />
    <rect x="36" y="24" width="18" height="18" fill="#1d4ed8" rx="3" />
    <rect x="18" y="32" width="14" height="14" fill="#00e5ff" rx="2" />
    <rect x="42" y="48" width="16" height="16" fill="#0284c7" rx="3" />
    <rect x="10" y="52" width="18" height="18" fill="#00b4d8" rx="3" />

    <!-- 3D 'V' Ribbon -->
    <path d="M 68 45 L 98 45 L 155 175 C 160 186 172 192 185 192 L 230 192 L 205 228 C 185 242 155 240 138 222 L 68 85 Z" fill="url(#vGrad)" />
    <!-- V folding corner depth -->
    <path d="M 138 222 L 180 190 L 155 175 Z" fill="#0f172a" opacity="0.35" />

    <!-- '7' Horizontal & Diagonal Bar -->
    <path d="M 175 92 L 315 92 C 322 92 328 97 325 104 L 285 195 C 275 218 245 230 220 230 L 175 230 L 195 192 L 245 192 C 255 192 265 186 270 176 L 288 132 L 175 132 Z" fill="url(#sevenGrad)" />
    
    <!-- '9' Loop and Ribbon Curve -->
    <path d="M 315 92 C 355 92 385 122 385 162 C 385 195 365 222 335 232 L 295 305 C 288 318 272 322 260 315 C 248 308 245 292 252 280 L 290 215 C 285 205 282 192 282 180 C 282 142 305 120 315 92 Z" fill="url(#nineGrad)" />

    <!-- 9 Inner Hole -->
    <path d="M 335 145 C 348 145 358 155 358 168 C 358 181 348 191 335 191 C 322 191 312 181 312 168 C 312 155 322 145 335 145 Z" fill="#ffffff" />
  </g>

  <!-- Typography: V79 Digital -->
  <g transform="translate(250, 395)" text-anchor="middle">
    <text font-family="'Montserrat', 'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="-1" fill="#0b1f33">
      V79 <tspan font-weight="700">Digital</tspan>
    </text>
  </g>

  <!-- Tagline: FROM IDEA TO ADVANTAGE -->
  <g transform="translate(250, 435)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" letter-spacing="7" fill="#1e3a8a">
      FROM IDEA TO ADVANTAGE
    </text>
  </g>
</svg>
